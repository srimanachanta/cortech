name: Build, Test, and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the wheels under (e.g. v0.2.0)"
        required: true
        type: string

jobs:
  build:
    name: Build and test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pin the macOS image: the Homebrew bottles it ships determine the
        # minimum macOS version of the dylibs delocate vendors into the wheel,
        # which must match MACOSX_DEPLOYMENT_TARGET in pyproject.toml
        os: [ubuntu-latest, macos-14, windows-2022]

    steps:
    - uses: actions/checkout@v4

      # Host interpreter for cibuildwheel only; the wheels it builds are
      # cp311-cp314 per [tool.cibuildwheel] in pyproject.toml
    - name: Python - set up host interpreter
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

      # Boost/GMP/MPFR don't build cleanly under plain MSVC, so on Windows we
      # pull Boost, Eigen, GMP, and MPFR from conda-forge instead (see
      # [tool.cibuildwheel.windows] in pyproject.toml, which runs the actual
      # `conda install` as its before-all hook). This step just activates a
      # conda env and exposes its pkg-config dir so meson can find them.
    - name: Set up conda-forge (Windows only)
      if: runner.os == 'Windows'
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge

      # gmp.pc and mpfr.pc land in lib/pkgconfig but eigen3.pc lands in
      # share/pkgconfig, so both go on the search path (";" separated, as
      # pkg-config expects on Windows). Boost ships no .pc file at all and
      # meson only looks at compiler default include dirs and a few hardcoded
      # C:\ locations, so it needs BOOST_ROOT to see the conda prefix.
    - name: Export dependency search paths (Windows only)
      if: runner.os == 'Windows'
      shell: bash -el {0}
      run: |
        echo "PKG_CONFIG_PATH=$CONDA_PREFIX/Library/lib/pkgconfig;$CONDA_PREFIX/Library/share/pkgconfig" >> "$GITHUB_ENV"
        echo "BOOST_ROOT=$CONDA_PREFIX/Library" >> "$GITHUB_ENV"
        echo "$CONDA_PREFIX/Library/bin" >> "$GITHUB_PATH"

      # Set persistent environment variables from vcvarsall. The tools
      # "enter-vsdevshell" in tools/ does the same but only in the current
      # shell
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.1.1
      with:
        output-dir: wheelhouse

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  publish:
    name: Create release with wheels from all platforms
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Artifact - download all platforms
      uses: actions/download-artifact@v4
      with:
        pattern: cibw-wheels-*
        path: dist
        merge-multiple: true
    - name: Artifact - Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        files: dist/*.whl
