[project]
name = "cortech"
authors = [
    { name = "Jesper Duemose Nielsen", email = "jesperdn@drcmr.dk" },
    { name = "Oula Puonti", email = "oulap@drcmr.dk" },
]
maintainers = [{ name = "Cortech developers" }]
license = { text = "GPL3" }
description = "Cortical layer placement and analysis"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "nibabel >= 5.3.0",
    "numba >= 0.60.0",
    "numpy >= 2.0.1,<3",
    "scipy >= 1.13.0",
]

[project.optional-dependencies]
vtk = ["pyvista >= 0.45.0"]

[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python >= 0.15.0",
    "meson >= 1.4.1",
    "cython >= 3.1.4",
    "numpy >= 2.0.1",
]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
archs = ["native"]
skip = ["*musllinux*"]

test-requires = "pytest"
test-command = "pytest {package}/tests"

[tool.cibuildwheel.macos]
before-all = "brew install boost eigen gmp mpfr pkg-config"

[tool.cibuildwheel.linux]
before-all = "dnf install -y boost-devel eigen3-devel gmp-devel mpfr-devel pkgconfig"
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.windows]
before-all = "conda install -y -c conda-forge boost eigen gmp mpfr pkg-config"
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
